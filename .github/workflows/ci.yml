name: CI

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json

  check-code:
    name: Check code
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - run: npm ci

      - run: npm test
      - run: npm run lint
      - run: npm run stylelint

      - name: Upload check-code artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check-code-artifacts
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, check-code]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org/'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - run: npm ci

      - name: Configure npm authentication
        run: npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}

      - name: Determine release tag
        id: tag
        run: |
          TAG="latest"
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == *"alpha"* ]]; then TAG="alpha"; fi
          if [[ "$REF" == *"beta"* ]]; then TAG="beta"; fi
          if [[ "$REF" == *"rc"* ]]; then TAG="rc"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm publish --tag ${{ steps.tag.outputs.tag }}