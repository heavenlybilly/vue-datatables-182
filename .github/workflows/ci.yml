name: CI & Publish

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run check:release

      - run: npm run check:types
      - run: npm test
      - run: npm run lint
      - run: npm run stylelint
      - run: npm run test:release

      - run: npm run check:package -- --output release
      - run: npm run build:storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook

      - name: Verify checked release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run check:release -- "$GITHUB_REF_NAME" release/package.tgz

      - name: Upload checked package
        uses: actions/upload-artifact@v4
        with:
          name: checked-package-node-${{ matrix.node }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - run: npm ci

      - name: Download checked archive
        uses: actions/download-artifact@v4
        with:
          name: checked-package-node-24
          path: release/

      - name: Verify archive and determine dist-tag
        id: tag
        run: npm run check:release -- "$GITHUB_REF_NAME" release/package.tgz

      - name: Publish package
        run: npm publish ./release/package.tgz --ignore-scripts --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}
